version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "jasminefosque"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "security"
    groups:
      production-dependencies:
        patterns:
          - "react*"
          - "@reduxjs/*"
          - "zod"
          - "react-hook-form"
          - "@hookform/*"
      development-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "react*"
          - "@reduxjs/*"
          - "zod"
          - "react-hook-form"
          - "@hookform/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "ci"
      - "dependencies"
